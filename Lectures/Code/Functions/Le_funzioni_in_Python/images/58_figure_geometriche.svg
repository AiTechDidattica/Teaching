<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 275" width="750" height="275" role="img"><title>Figure geometriche e significato dei parametri per il calcolo delle rispettive aree.</title><rect x="0" y="0" width="750" height="275" fill="#ffffff" /><rect x="8" y="8" width="238" height="257" rx="9" fill="#FFFFFF" stroke="#B9C4D0" stroke-width="1.7" /><text x="127" y="33" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">Quadrato</text><rect x="63" y="54" width="128" height="128" fill="#EAF2FF" stroke="#2863B6" stroke-width="2" /><polyline points="63,190 63,200 191,200 191,190" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="127" y="217" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">a</text><text x="127" y="244" font-size="19" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">A = a²</text><rect x="256" y="8" width="238" height="257" rx="9" fill="#FFFFFF" stroke="#B9C4D0" stroke-width="1.7" /><text x="375" y="33" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">Triangolo</text><polygon points="286,182 381,54 466,182" fill="#EAF2FF" stroke="#2863B6" stroke-width="2" /><polyline points="381,54 381,182" fill="none" stroke="#C18020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" /><polyline points="381,170 393,170 393,182" fill="none" stroke="#C18020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="396" y="121" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">b</text><text x="375" y="207" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">a</text><text x="375" y="244" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">A = (a × b) / 2</text><rect x="504" y="8" width="238" height="257" rx="9" fill="#FFFFFF" stroke="#B9C4D0" stroke-width="1.7" /><text x="623" y="33" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">Trapezio</text><polygon points="526,182 568,77 674,77 720,182" fill="#EAF2FF" stroke="#2863B6" stroke-width="2" /><polyline points="674,77 674,182" fill="none" stroke="#C18020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" /><polyline points="674,170 686,170 686,182" fill="none" stroke="#C18020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="692" y="133" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">c</text><text x="623" y="68" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">b</text><text x="623" y="207" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">a</text><text x="623" y="244" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">A = ((a + b) × c) / 2</text></svg>