<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 255" width="750" height="255" role="img"><title>Classificazione delle funzioni in base alla disponibilità nel programma corrente.</title><rect x="0" y="0" width="750" height="255" fill="#ffffff" /><rect x="250" y="10" width="250" height="43" rx="9" fill="#F1F4F8" stroke="#77879A" stroke-width="1.7" /><text x="375.0" y="37.62" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#293C50" text-anchor="middle">Funzioni in Python</text><polyline points="375,53 375,73 125,73" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="375,73 625,73" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="125,73 125,91" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="125,91 120.5,82.0 129.5,82.0" fill="#77879A" /><rect x="8" y="92" width="234" height="143" rx="9" fill="#EAF2FF" stroke="#2863B6" stroke-width="1.7" /><text x="125" y="119" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#174580" text-anchor="middle">Built-in</text><text x="125" y="144" font-size="14" font-family="DejaVu Sans" font-weight="normal" fill="#174580" text-anchor="middle">Disponibili direttamente</text><text x="125" y="181" font-size="14" font-family="DejaVu Sans Mono" font-weight="normal" fill="#174580" text-anchor="middle">print(), len(), round()</text><polyline points="375,73 375,91" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="375,91 370.5,82.0 379.5,82.0" fill="#77879A" /><rect x="258" y="92" width="234" height="143" rx="9" fill="#FFF3DC" stroke="#C18020" stroke-width="1.7" /><text x="375" y="119" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#85510C" text-anchor="middle">Moduli e librerie</text><text x="375" y="144" font-size="14" font-family="DejaVu Sans" font-weight="normal" fill="#85510C" text-anchor="middle">Disponibili con import</text><text x="375" y="181" font-size="14" font-family="DejaVu Sans Mono" font-weight="normal" fill="#85510C" text-anchor="middle">math.sqrt()</text><text x="375" y="203" font-size="14" font-family="DejaVu Sans Mono" font-weight="normal" fill="#85510C" text-anchor="middle">random.randint()</text><polyline points="625,73 625,91" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="625,91 620.5,82.0 629.5,82.0" fill="#77879A" /><rect x="508" y="92" width="234" height="143" rx="9" fill="#E5F5EF" stroke="#16836D" stroke-width="1.7" /><text x="625" y="119" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#105E50" text-anchor="middle">User-defined</text><text x="625" y="144" font-size="14" font-family="DejaVu Sans" font-weight="normal" fill="#105E50" text-anchor="middle">Definite nel programma</text><text x="625" y="181" font-size="14" font-family="DejaVu Sans Mono" font-weight="normal" fill="#105E50" text-anchor="middle">mostra_menu()</text><text x="625" y="203" font-size="14" font-family="DejaVu Sans Mono" font-weight="normal" fill="#105E50" text-anchor="middle">calcola_area()</text></svg>