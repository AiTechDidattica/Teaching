<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 370" width="690" height="370" role="img"><title>Rappresentazione semplificata delle chiamate ricorsive e della restituzione dei risultati nel fattoriale di 3.</title><rect x="0" y="0" width="690" height="370" fill="#ffffff" /><text x="180" y="25" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#174580" text-anchor="middle">Chiamate ricorsive</text><text x="510" y="25" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#105E50" text-anchor="middle">Valori restituiti</text><rect x="20" y="42" width="320" height="53" rx="9" fill="#EAF2FF" stroke="#2863B6" stroke-width="1.7" /><text x="180" y="63" font-size="17" font-family="DejaVu Sans Mono" font-weight="bold" fill="#24364A" text-anchor="middle">fattoriale(3)</text><text x="180" y="83" font-size="14" font-family="DejaVu Sans" font-weight="normal" fill="#24364A" text-anchor="middle">3 × fattoriale(2)</text><rect x="370" y="42" width="300" height="53" rx="9" fill="#E5F5EF" stroke="#16836D" stroke-width="1.7" /><text x="520" y="75" font-size="19" font-family="DejaVu Sans Mono" font-weight="bold" fill="#105E50" text-anchor="middle">3 × 2 = 6</text><polyline points="180,95 180,115" fill="none" stroke="#2863B6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="174,109 180,115 186,109" fill="none" stroke="#2863B6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="520,116 520,96" fill="none" stroke="#16836D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="514,102 520,96 526,102" fill="none" stroke="#16836D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="20" y="116" width="320" height="53" rx="9" fill="#EAF2FF" stroke="#2863B6" stroke-width="1.7" /><text x="180" y="137" font-size="17" font-family="DejaVu Sans Mono" font-weight="bold" fill="#24364A" text-anchor="middle">fattoriale(2)</text><text x="180" y="157" font-size="14" font-family="DejaVu Sans" font-weight="normal" fill="#24364A" text-anchor="middle">2 × fattoriale(1)</text><rect x="370" y="116" width="300" height="53" rx="9" fill="#E5F5EF" stroke="#16836D" stroke-width="1.7" /><text x="520" y="149" font-size="19" font-family="DejaVu Sans Mono" font-weight="bold" fill="#105E50" text-anchor="middle">2 × 1 = 2</text><polyline points="180,169 180,189" fill="none" stroke="#2863B6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="174,183 180,189 186,183" fill="none" stroke="#2863B6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="520,190 520,170" fill="none" stroke="#16836D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="514,176 520,170 526,176" fill="none" stroke="#16836D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="20" y="190" width="320" height="53" rx="9" fill="#EAF2FF" stroke="#2863B6" stroke-width="1.7" /><text x="180" y="211" font-size="17" font-family="DejaVu Sans Mono" font-weight="bold" fill="#24364A" text-anchor="middle">fattoriale(1)</text><text x="180" y="231" font-size="14" font-family="DejaVu Sans" font-weight="normal" fill="#24364A" text-anchor="middle">1 × fattoriale(0)</text><rect x="370" y="190" width="300" height="53" rx="9" fill="#E5F5EF" stroke="#16836D" stroke-width="1.7" /><text x="520" y="223" font-size="19" font-family="DejaVu Sans Mono" font-weight="bold" fill="#105E50" text-anchor="middle">1 × 1 = 1</text><polyline points="180,243 180,263" fill="none" stroke="#2863B6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="174,257 180,263 186,257" fill="none" stroke="#2863B6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="520,264 520,244" fill="none" stroke="#16836D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="514,250 520,244 526,250" fill="none" stroke="#16836D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="20" y="264" width="320" height="53" rx="9" fill="#FFF3DC" stroke="#C18020" stroke-width="1.7" /><text x="180" y="285" font-size="17" font-family="DejaVu Sans Mono" font-weight="bold" fill="#24364A" text-anchor="middle">fattoriale(0)</text><text x="180" y="305" font-size="14" font-family="DejaVu Sans" font-weight="normal" fill="#24364A" text-anchor="middle">Caso base</text><rect x="370" y="264" width="300" height="53" rx="9" fill="#E5F5EF" stroke="#16836D" stroke-width="1.7" /><text x="520" y="297" font-size="19" font-family="DejaVu Sans Mono" font-weight="bold" fill="#105E50" text-anchor="middle">1</text><polyline points="340,290 368,290" fill="none" stroke="#C18020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="362,284 368,290 362,296" fill="none" stroke="#C18020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="345" y="352" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#105E50" text-anchor="middle">Risultato finale: fattoriale(3) = 6</text></svg>