<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" width="720" height="395" role="img"><title>Distinzione tra comunicazione interna (parametri e return) e comunicazione con l’utente (input e print).</title><rect x="0" y="0" width="720" height="395" fill="#ffffff" /><rect x="95" y="8" width="530" height="61" rx="9" fill="#F1F4F8" stroke="#77879A" stroke-width="1.7" /><text x="360.0" y="32.47" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#293C50" text-anchor="middle">Programma chiamante</text><text x="360.0" y="56.769999999999996" font-size="18" font-family="DejaVu Sans" font-weight="normal" fill="#293C50" text-anchor="middle">main()</text><rect x="95" y="166" width="530" height="61" rx="9" fill="#EAF2FF" stroke="#2863B6" stroke-width="1.7" /><text x="360.0" y="190.805" font-size="17" font-family="DejaVu Sans" font-weight="bold" fill="#174580" text-anchor="middle">funzione()</text><text x="360.0" y="213.755" font-size="17" font-family="DejaVu Sans" font-weight="normal" fill="#174580" text-anchor="middle">Acquisizione, elaborazione, visualizzazione</text><rect x="95" y="325" width="530" height="61" rx="9" fill="#FFF3DC" stroke="#C18020" stroke-width="1.7" /><text x="360.0" y="349.80499999999995" font-size="17" font-family="DejaVu Sans" font-weight="bold" fill="#85510C" text-anchor="middle">Utente</text><text x="360.0" y="372.75499999999994" font-size="17" font-family="DejaVu Sans" font-weight="normal" fill="#85510C" text-anchor="middle">Tastiera e schermo</text><polyline points="220,69 220,166" fill="none" stroke="#2863B6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="220,166 215.5,157.0 224.5,157.0" fill="#2863B6" /><text x="206" y="117" font-size="15" font-family="DejaVu Sans" font-weight="bold" fill="#174580" text-anchor="end">Argomenti</text><polyline points="500,166 500,69" fill="none" stroke="#16836D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="500,69 504.5