<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="740" height="420" role="img"><title>Rappresentazione semplificata dei principali ambienti di visibilità in Python.</title><rect x="0" y="0" width="740" height="420" fill="#ffffff" /><rect x="12" y="12" width="716" height="396" rx="9" fill="#F1F4F8" stroke="#77879A" stroke-width="1.7" /><text x="28" y="40" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#293C50" text-anchor="start">BUILT-IN NAMESPACE</text><text x="28" y="64" font-size="16" font-family="DejaVu Sans Mono" font-weight="normal" fill="#293C50" text-anchor="start">print(), input(), len(), abs(), ...</text><rect x="28" y="82" width="684" height="310" rx="9" fill="#EAF2FF" stroke="#2863B6" stroke-width="1.7" /><text x="46" y="110" font-size="18" font-family="DejaVu Sans" font-weight="bold" fill="#174580" text-anchor="start">GLOBAL NAMESPACE – modulo</text><text x="46" y="138" font-size="16" font-family="DejaVu Sans Mono" font-weight="normal" fill="#174580" text-anchor="start">numero = 100; funzione_1, funzione_2, main</text><rect x="44" y="168" width="208" height="182" rx="9" fill="#E5F5EF" stroke="#16836D" stroke-width="1.7" /><text x="148" y="194" font-size="14" font-family="DejaVu Sans" font-weight="bold" fill="#105E50" text-anchor="middle">LOCAL NAMESPACE</text><text x="148" y="232" font-size="17" font-family="DejaVu Sans Mono" font-weight="bold" fill="#105E50" text-anchor="middle">funzione_1()</text><text x="148" y="271" font-size="15" font-family="DejaVu Sans Mono" font-weight="normal" fill="#105E50" text-anchor="middle">numero = 10</text><rect x="266" y="168" width="208" height="182" rx="9" fill="#E5F5EF" stroke="#16836D" stroke-width="1.7" /><text x="370" y="194" font-size="14" font-family="DejaVu Sans" font-weight="bold" fill="#105E50" text-anchor="middle">LOCAL NAMESPACE</text><text x="370" y="232" font-size="17" font-family="DejaVu Sans Mono" font-weight="bold" fill="#105E50" text-anchor="middle">funzione_2()</text><text x="370" y="271" font-size="15" font-family="DejaVu Sans Mono" font-weight="normal" fill="#105E50" text-anchor="middle">numero = 20</text><rect x="488" y="168" width="208" height="182" rx="9" fill="#E5F5EF" stroke="#16836D" stroke-width="1.7" /><text x="592" y="194" font-size="14" font-family="DejaVu Sans" font-weight="bold" fill="#105E50" text-anchor="middle">LOCAL NAMESPACE</text><text x="592" y="232" font-size="17" font-family="DejaVu Sans Mono" font-weight="bold" fill="#105E50" text-anchor="middle">main()</text><text x="592" y="271" font-size="15" font-family="DejaVu Sans Mono" font-weight="normal" fill="#105E50" text-anchor="middle">ambiente locale</text><text x="370" y="374" font-size="14" font-family="DejaVu Sans" font-weight="normal" fill="#24364A" text-anchor="middle">Ambienti distinti; la rappresentazione è concettuale.</text></svg>