 fill="#77879A" /><rect x="12" y="191" width="306" height="65" rx="9" fill="#EAF2FF" stroke="#2863B6" stroke-width="1.7" /><text x="165.0" y="218.14" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#174580" text-anchor="middle">Calcolo dell’area</text><text x="165.0" y="239.73999999999998" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#174580" text-anchor="middle">calcola_area()</text><polyline points="360,223.5 318,223.5" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="318,223.5 327.0,219.0 327.0,228.0" fill="#77879A" /><rect x="402" y="191" width="306" height="65" rx="9" fill="#E5F5EF" stroke="#16836D" stroke-width="1.7" /><text x="555.0" y="218.14" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#105E50" text-anchor="middle">Visualizzazione</text><text x="555.0" y="239.73999999999998" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#105E50" text-anchor="middle">stampa_risultati()</text><polyline points="360,223.5 402,223.5" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="402,223.5 393.0,228.0 393.0,219.0" fill="#77879A" /><text x="360" y="281" font-size="14" font-family="DejaVu Sans" font-weight="normal" fill="#293C50" text-anchor="middle">Organizzazione delle funzioni (non ordine di esecuzione)</text></svg>