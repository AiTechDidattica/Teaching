<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img"><title>Scambio di dati tra il programma chiamante e la funzione chiamata.</title><rect x="0" y="0" width="680" height="280" fill="#ffffff" /><rect x="80" y="10" width="520" height="65" rx="9" fill="#F1F4F8" stroke="#77879A" stroke-width="1.7" /><text x="340.0" y="36.805" font-size="17" font-family="DejaVu Sans" font-weight="bold" fill="#293C50" text-anchor="middle">Programma chiamante (caller)</text><text x="340.0" y="59.755" font-size="17" font-family="DejaVu Sans" font-weight="normal" fill="#293C50" text-anchor="middle">risultato = funzione(dati)</text><rect x="80" y="205" width="520" height="65" rx="9" fill="#EAF2FF" stroke="#2863B6" stroke-width="1.7" /><text x="340.0" y="231.805" font-size="17" font-family="DejaVu Sans" font-weight="bold" fill="#174580" text-anchor="middle">Funzione chiamata (callee)</text><text x="340.0" y="254.755" font-size="17" font-family="DejaVu Sans" font-weight="normal" fill="#174580" text-anchor="middle">def funzione(parametri): ...</text><polyline points="205,75 205,205" fill="none" stroke="#2863B6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="205,205 200.5,196.0 209.5,196.0" fill="#2863B6" /><polyline points="475,205 475,75" fill="none" stroke="#16836D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="475,75 479.5,84.0 470.5,84.0" fill="#16836D" /><text x="193" y="119" font-size="15" font-family="DejaVu Sans" font-weight="bold" fill="#174580" text-anchor="end">INPUT</text><text x="193" y="142" font-size="14" font-family="DejaVu Sans" font-weight="normal" fill="#174580" text-anchor="end">Argomenti</text><text x="487" y="119" font-size="15" font-family="DejaVu Sans" font-weight="bold" fill="#105E50" text-anchor="start">OUTPUT</text><text x="487" y="142" font-size="14" font-family="DejaVu Sans" font-weight="normal" fill="#105E50" text-anchor="start">Valore restituito</text></svg>