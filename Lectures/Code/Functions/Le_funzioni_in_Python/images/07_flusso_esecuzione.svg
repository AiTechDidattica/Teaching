<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img"><title>Trasferimento e restituzione del controllo di esecuzione tra chiamante e chiamato.</title><rect x="0" y="0" width="720" height="500" fill="#ffffff" /><rect x="12" y="10" width="316" height="480" rx="9" fill="#FFFFFF" stroke="#B9C4D0" stroke-width="1.7" /><rect x="392" y="10" width="316" height="480" rx="9" fill="#FFFFFF" stroke="#B9C4D0" stroke-width="1.7" /><text x="170" y="38" font-size="17" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">Programma chiamante (caller)</text><text x="550" y="38" font-size="17" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">Funzione chiamata (callee)</text><rect x="30" y="63" width="280" height="56" rx="9" fill="#F1F4F8" stroke="#77879A" stroke-width="1.7" /><text x="170.0" y="96.1" font-size="15" font-family="DejaVu Sans" font-weight="bold" fill="#293C50" text-anchor="middle">1. Esecuzione delle istruzioni</text><polyline points="170,119 170,145" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="170,145 165.5,136.0 174.5,136.0" fill="#77879A" /><rect x="30" y="145" width="280" height="55" rx="9" fill="#EAF2FF" stroke="#2863B6" stroke-width="1.7" /><text x="170.0" y="177.94" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#174580" text-anchor="middle">2. Chiamata: funzione()</text><rect x="410" y="145" width="280" height="55" rx="9" fill="#EAF2FF" stroke="#2863B6" stroke-width="1.7" /><text x="550.0" y="177.94" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#174580" text-anchor="middle">3. Inizio della funzione</text><polyline points="310,172 410,172" fill="none" stroke="#2863B6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="410,172 401.0,176.5 401.0,167.5" fill="#2863B6" /><text x="360" y="158" font-size="12" font-family="DejaVu Sans" font-weight="bold" fill="#174580" text-anchor="middle">Controllo</text><polyline points="550,200 550,237" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="550,237 545.5,228.0 554.5,228.0" fill="#77879A" /><rect x="410" y="237" width="280" height="55" rx="9" fill="#F1F4F8" stroke="#77879A" stroke-width="1.7" /><text x="550.0" y="269.94" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#293C50" text-anchor="middle">4. Esecuzione del corpo</text><polyline points="550,292 550,336" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="550,336 545.5,327.0 554.5,327.0" fill="#77879A" /><rect x="410" y="336" width="280" height="58" rx="9" fill="#E5F5EF" stroke="#16836D" stroke-width="1.7" /><text x="550.0" y="359.64" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#105E50" text-anchor="middle">Fine della funzione</text><text x="550.0" y="381.24" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#105E50" text-anchor="middle">Ritorno al chiamante</text><rect x="64" y="240" width="212" height="51" rx="9" fill="#F1F4F8" stroke="#77879A" stroke-width="1.7" /><text x="170" y="270" font-size="15" font-family="DejaVu Sans" font-weight="normal" fill="#24364A" text-anchor="middle">Esecuzione sospesa</text><polyline points="170,200 170,240" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" /><polyline points="170,291 170,336" fill="none" stroke="#77879A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" /><rect x="30" y="336" width="280" height="58" rx="9" fill="#E5F5EF" stroke="#16836D" stroke-width="1.7" /><text x="170.0" y="370.44" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#105E50" text-anchor="middle">5. Ripresa dell’esecuzione</text><polyline points="410,365 310,365" fill="none" 