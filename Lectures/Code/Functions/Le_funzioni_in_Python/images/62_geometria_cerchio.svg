<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" role="img"><title>Rappresentazione geometrica del cerchio e formule utilizzate.</title><rect x="0" y="0" width="660" height="270" fill="#ffffff" /><circle cx="150" cy="125" r="101" fill="#EAF2FF" stroke="#2863B6" stroke-width="2.4" /><circle cx="150" cy="125" r="4" fill="#293C50" /><polyline points="150,125 230.8,64.4" fill="none" stroke="#C18020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="230.8" cy="64.4" r="4" fill="#C18020" /><text x="183" y="85" font-size="20" font-family="DejaVu Sans" font-weight="bold" fill="#85510C" text-anchor="middle">r</text><text x="140" y="145" font-size="14" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">O</text><text x="150" y="249" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">Cerchio di raggio r</text><rect x="300" y="50" width="335" height="72" rx="9" fill="#EAF2FF" stroke="#2863B6" stroke-width="1.7" /><text x="467" y="74" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">Perimetro (circonferenza)</text><text x="467" y="105" font-size="24" font-family="DejaVu Sans" font-weight="bold" fill="#174580" text-anchor="middle">P = 2 × π × r</text><rect x="300" y="141" width="335" height="72" rx="9" fill="#E5F5EF" stroke="#16836D" stroke-width="1.7" /><text x="467" y="166" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#24364A" text-anchor="middle">Area</text><text x="467" y="198" font-size="24" font-family="DejaVu Sans" font-weight="bold" fill="#105E50" text-anchor="middle">A = π × r²</text></svg>